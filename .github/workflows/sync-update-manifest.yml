name: sync update manifest

# 清单放两处：Release asset 是客户端主源，updates/update.json 是仓库镜像。
# 这里在 Release 发布后把 asset 同步回镜像，避免两处靠人工维护走偏。
# 上传/更新 asset 不会再次触发 published，补同步可用 workflow_dispatch 传 tag。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync from (e.g. v2.5.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download update.json from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p .manifest-tmp
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir .manifest-tmp; then
            echo "::notice::Release $TAG has no update.json asset; nothing to sync"
            exit 0
          fi
          if [ ! -f .manifest-tmp/update.json ]; then
            echo "::notice::no update.json downloaded"
            exit 0
          fi
          cp .manifest-tmp/update.json .manifest-tmp/incoming.json

      - name: Commit mirror when it differs
        run: |
          if [ ! -f .manifest-tmp/incoming.json ]; then
            echo "no manifest asset, skip"
            exit 0
          fi
          mkdir -p updates
          if cmp -s .manifest-tmp/incoming.json updates/update.json; then
            echo "mirror already in sync"
            exit 0
          fi
          cp .manifest-tmp/incoming.json updates/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/update.json
          git commit -m "chore: sync update manifest from ${TAG}"
          git push origin main
