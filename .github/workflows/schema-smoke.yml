name: schema-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验旁挂服务依赖的 amane.db 列
        run: |
          python - <<'PY'
          import sqlite3
          needed = {
            'media_files': ['id','path','metadata_id','library_id','size','duration',
                            'definition','mosaic','has_subtitle_in_name','has_external_subtitle','oshash'],
            'metadata': ['id','number','title','plot','actors','tags','studio','series',
                         'release','runtime','content_type','poster_urls','thumb_urls',
                         'extrafanart_urls','scores','updated_at'],
            'libraries': ['id','name'],
          }
          conn = sqlite3.connect(':memory:')
          for table, cols in needed.items():
              ddl = ', '.join(f'{c} TEXT' for c in cols)
              conn.execute(f'CREATE TABLE {table} ({ddl})')
              got = {r[1] for r in conn.execute(f'PRAGMA table_info({table})')}
              missing = set(cols) - got
              assert not missing, f'{table} 缺列: {missing}'
          print('schema fixture OK:', {k: len(v) for k, v in needed.items()})
          PY
      - name: 服务端与工具语法编译
        run: python -m py_compile server/server.py server/ext/*/server_ext.py tools/agentctl.py tools/scan_secrets.py
      - name: 扩展清单只含公开扩展
        run: |
          python - <<'PY'
          import json
          data = json.load(open('server/extensions.json', encoding='utf-8'))
          ids = [e['id'] for e in data['extensions']]
          assert ids == ['actors', 'facets', 'subtitles'], ids
          assert all(e.get('scope') == 'public' for e in data['extensions']), '出现非公开扩展'
          print('extensions OK:', ids)
          PY
      - name: 在线字幕源必须保持未启用
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('server/ext/subtitles/server_ext.py').read_text(encoding='utf-8')
          assert '"providers": []' in src, '在线字幕源未经批准被启用'
          assert 'http' not in src.split('def providers_list')[1][:400], 'providers 端点不应访问网络'
          print('providers 恒为空 OK')
          PY
