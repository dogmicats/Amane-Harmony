name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 泛化脱敏扫描（规则文件本身不含任何真实值）
        run: python tools/scan_secrets.py --path . --json
      - name: 公开规则文件自检
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('tools/scan_secrets.py').read_text(encoding='utf-8')
          forbidden = ['dogmicats', 'TwbIc', '192.168.3', 'APTX', '/vol2/1000']
          bad = [x for x in forbidden if x in t]
          if bad:
              raise SystemExit(f'规则文件里出现真实身份串: {bad}')
          print('规则文件干净')
          PY
